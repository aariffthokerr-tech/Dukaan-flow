<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · DukaanFlow</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        color: #171717;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        border: 1px solid #e5e5e5;
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #b45309;
        background: #fffbeb;
        border: 1px solid #fde68a;
        border-radius: 999px;
        padding: 4px 10px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
        font-weight: 700;
        color: #111315;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.6;
        color: #525252;
      }
      .actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }
      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 18px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        background: #111315;
        color: #ffffff;
        border: none;
      }
      a {
        background: #ffffff;
        color: #171717;
        border: 1px solid #d4d4d4;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">You Are Offline</span>
      <h1>No Internet Connection</h1>
      <p>
        DukaanFlow requires an active connection to load live storefronts, edit shop catalogs,
        upload product images, or submit enquiries. Private dashboard data is never cached
        for security.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Try Reconnecting</button>
        <a href="/">Go Home</a>
      </div>
    </main>
  </body>
</html>
